name: Android Build (AAB & APK)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Output format'
        required: true
        default: 'aab'
        type: choice
        options:
          - aab
          - apk
          - both

jobs:
  build:
    name: Build Android (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm install

      - name: Build Release Bundle (.aab)
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        run: |
          cd android
          ENVFILE=.env.production ./gradlew bundleRelease --no-daemon

      - name: Build Release APK (.apk)
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: |
          cd android
          ENVFILE=.env.production ./gradlew assembleRelease --no-daemon

      - name: Upload AAB Artifact
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK Artifact
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
