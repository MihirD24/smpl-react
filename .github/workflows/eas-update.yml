name: EAS Update (OTA)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel (production, preview, etc.)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      message:
        description: 'Update message / description'
        required: false
        default: 'Manual OTA update trigger'
        type: string

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Publish OTA Update
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            eas update --channel ${{ inputs.channel }} --message "${{ inputs.message }}" --non-interactive
          else
            eas update --channel production --auto --non-interactive
          fi
